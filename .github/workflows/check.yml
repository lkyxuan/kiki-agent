# Every PR: type check and tests (Linux, cheap). A real package build on Mac only runs in the public repo (Mac is free for public repos);
# the private repo kiki-pro does not use Mac on PRs (billed at 10x), packaging issues are caught at release time by build-from-pro.
name: check
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
  check:
    if: github.repository == 'lkyxuan/kiki'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: packaging/build.sh arm64
      - name: Self-test the built App
        run: |
          APP=out/build-arm64/Kiki.app
          file "$APP/Contents/MacOS/Kiki"
          "$APP/Contents/Resources/node/bin/node" "$APP/Contents/Resources/app/dist/main.js" --selftest
      - name: Hardened runtime self-test (same approach as the real signing, just with a local signature, to confirm Node still runs under notarization requirements)
        run: |
          H=out/hardened/Kiki.app
          rm -rf out/hardened && mkdir -p out/hardened && ditto out/build-arm64/Kiki.app "$H"
          KIKI_SIGN_IDENTITY=- packaging/sign.sh app "$H"
          codesign -dv --verbose=4 "$H/Contents/Helpers/KikiAgent.app" 2>&1 | grep -E "flags=.*runtime"
          codesign -d --entitlements - "$H/Contents/Helpers/KikiAgent.app" 2>&1 | grep -q automation.apple-events
          "$H/Contents/Resources/node/bin/node" "$H/Contents/Resources/app/dist/main.js" --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: Kiki-mac-arm64
          path: out/Kiki-mac-arm64.zip
          retention-days: 7
