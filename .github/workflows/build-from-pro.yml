# Build from pro (only runs in the public repo lkyxuan/kiki): after the private repo cyberight-cap/kiki-pro bumps the version and merges into main,
# its release workflow sends a kiki-release signal here (with the commit SHA), and this workflow uses the public repo's free Mac
# runners to temporarily pull that commit's code → check → test → package, sign and notarize → publish to this repo's Releases. The code never enters this repo, and the machine is destroyed after use.
# An installed Kiki discovers the new version within an hour and installs it automatically when idle. The .dmg is for first-time installs; auto-update uses the .zip.
# Required Secrets (all in lkyxuan/kiki): KIKI_PRO_TOKEN (a token that can read kiki-pro) + the 5 signing/notarization ones.
# You can also run it manually from the Actions page, entering a kiki-pro commit SHA or branch name.
name: build-from-pro
on:
  repository_dispatch:
    types: [kiki-release]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch name in kiki-pro
        default: main
permissions:
  contents: write
concurrency:
  group: build-from-pro
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'lkyxuan/kiki'
    runs-on: macos-latest   # Native windows must be compiled on a Mac (free for public repos)
    env:
      GH_REPO: ${{ github.repository }}   # The working directory is the private repo's code, so gh would default to kiki-pro; pin it to this repo
    steps:
      - name: Pull the private repo's code
        uses: actions/checkout@v4
        with:
          repository: cyberight-cap/kiki-pro
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
          token: ${{ secrets.KIKI_PRO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Has this version been released already
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p 'require("./package.json").version')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v has already been released, skipping"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.skip != '1'
        run: npm ci
      - if: steps.ver.outputs.skip != '1'
        run: npm run check && npm test
      # Apple signing and notarization: only done if the certificate is configured in the repo Secrets; otherwise it's local signing only, as before. See docs/signing.md for the steps
      - name: Import the developer certificate
        id: sign
        if: steps.ver.outputs.skip != '1'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$P12" ]; then echo "MACOS_CERT_P12 is not configured, this build will not be signed"; exit 0; fi
          KC="$RUNNER_TEMP/kiki-signing.keychain-db"
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)
          [ -n "$ID" ] || { echo "No Developer ID Application in the certificate (did you export the wrong certificate?)"; exit 1; }
          echo "Signing identity: $ID"
          echo "KIKI_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "signed=1" >> "$GITHUB_OUTPUT"
          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
      - if: steps.ver.outputs.skip != '1'
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/build.sh arm64 && packaging/build.sh x64
      - name: Check whether the .dmg opens directly (only counts if notarized)
        if: steps.ver.outputs.skip != '1' && steps.sign.outputs.signed == '1'
        id: gate
        run: |
          if spctl -a -t open --context context:primary-signature -vv out/Kiki-mac-arm64.dmg; then
            echo "notarized=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signed but not notarized (notarization key not configured?), others will still be blocked on first open"
          fi
      - name: Create Release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTARIZED: ${{ steps.gate.outputs.notarized }}
        run: |
          if [ "$NOTARIZED" = 1 ]; then
            cat > notes.md <<'EOF'
          ## Install
          - **Download the .dmg**: choose `Kiki-mac-arm64.dmg` for Apple silicon, `Kiki-mac-x64.dmg` for Intel. Open it, drag Kiki into Applications, and double-click to use (notarized by Apple).
          - Or run one line in Terminal: `curl -fsSL https://raw.githubusercontent.com/lkyxuan/kiki-agent/main/packaging/install.sh | bash`
          - An already-installed Kiki updates itself (checks once an hour), no need to download again.
          EOF
          else
          cat > notes.md <<'EOF'
          ## Install
          - **Recommended**: run one line in Terminal (downloads, verifies, installs and launches automatically, and won't be blocked by the system):
            `curl -fsSL https://raw.githubusercontent.com/lkyxuan/kiki-agent/main/packaging/install.sh | bash`
          - **Or download the .dmg**: choose `Kiki-mac-arm64.dmg` for Apple silicon, `Kiki-mac-x64.dmg` for Intel. Open it and drag Kiki into Applications.
            Kiki is not yet signed with an Apple developer certificate, so the first open shows "cannot verify the developer": go to System Settings → Privacy & Security and click "Open Anyway" at the bottom,
            or run `xattr -dr com.apple.quarantine /Applications/Kiki.app` in Terminal.
          - An already-installed Kiki updates itself (checks once an hour), no need to download again.
          EOF
          fi
          # The tag is placed on this repo's main (the private repo's commits aren't here); don't auto-generate release notes, to avoid listing the private repo's commits
          gh release create "$TAG" out/Kiki-mac-arm64.dmg out/Kiki-mac-x64.dmg out/Kiki-mac-arm64.zip out/Kiki-mac-x64.zip out/SHA256SUMS \
            --title "Kiki $TAG" --notes-file notes.md
      - name: Clean up the temporary keychain
        if: always() && steps.sign.outputs.signed == '1'
        run: security delete-keychain "$RUNNER_TEMP/kiki-signing.keychain-db" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"
